# FREILab: build our fork's image and publish it to GHCR.
# Deployed by Komodo (FREILab/manifests, part-db stack), which polls the :master tag.
# Kept in a separate file so syncing with upstream Part-DB never conflicts.
name: FREILab image

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: freilab-image
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'FREILab/Part-DB-server'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/freilab/part-db-server
          tags: |
            type=raw,value=master
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
